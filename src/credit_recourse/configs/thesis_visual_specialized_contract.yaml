schema_version: thesis_visual_specialized_contract_v1
purpose: Dedicated semantic contracts for thesis assets that cannot be generated by
  generic token matching.
asset_ids:
  new:
  - A9
  - D10
  - E6
  - E7
  - F7
  - F8
  - G5
  - G6
  - I5
  - I6
  enhanced:
  - C9
  - F5
  - G4
terminology:
  forbidden_asset_title_terms:
  - 행동예산
  preferred_action_constraint_term: 행동크기 제약
c9_capture:
  numeric_tolerance: 1.0e-12
  definitions:
    max_with_ties:
      denominator: all_firms
      rule: selected candidate score equals the within-firm maximum within tolerance;
        tied maxima count as captured
    unique_argmax:
      denominator: firms_with_exactly_one_maximum
      rule: selected candidate equals the unique within-firm argmax
    top3_tie_inclusive:
      denominator: all_firms
      rule: selected candidate has descending minimum rank at most 3; ties at the
        third boundary are included
f5_equivalence_forest:
  primary_oracle: alpha
  preregistration_filename: c4r_journal_extension_prereg_v3.json
  expected_margin: 0.109
  expected_interaction_rows: 18
g4_tost_coverage:
  within_arm_filename: c4r_tost_within_arm_alpha.csv
  interaction_filename: c4r_tost_interactions_alpha.csv
  metadata_filename: metadata.json
  expected_within_arm_rows: 24
  expected_interaction_rows: 18
  expected_total_rows: 42
  primary_oracle: alpha
n1_common_scale:
  primary_oracle: alpha
  format_contrast: candidate_selection_minus_free_form_10d
  matching_policy: C6
  matching_mode: free_form_10d
  matching_shuffle_within: industry
  reference_contrast: reference_content_conditional
  matching_run_role: paper_primary_gpt54
  matching_information_condition: IC-b
  matching_cell: row_shuffle_vector_null_native_industry
n2_e2_e3_rank_correlation:
  primary_oracle: alpha
  components:
  - self_revision_alpha
  - reference_content_conditional_alpha
  preferred_budgets:
  - 0p75
  - unbounded
  cohort_match_contract: exact_backend_id_then_exact_row_id_x_budget
  e2_manifest: c4r_matched_inference_manifest.json
  e3_subdir: v3_matched
n6_test3_panel:
  required_splits:
  - dev
  - oot
  - post
  direction_property: P3_direction
  direction_metric: agreement
n10_repeat_stability:
  conditional: true
  filename: llm_repeat_stability.csv
  required_columns:
  - backend_id
  - information_condition
  - repeat_a
  - repeat_b
  - n_firms
  - action_identity_rate
  - effect_rank_spearman_alpha
  interpretation_boundary: Missing live repeat-cohort evidence must skip I6 explicitly;
    RL seven-seed artifacts are not a substitute.
